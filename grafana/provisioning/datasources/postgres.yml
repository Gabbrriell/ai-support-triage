apiVersion: 1
datasources:
  - name: Support DB
    uid: support-db
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: support
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
